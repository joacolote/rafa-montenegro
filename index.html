
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rafa Montenegro</title>
<style>
body{margin:0;background:#101018;color:#f5f2ed;font-family:Arial,sans-serif;padding:24px}
main{max-width:560px;margin:auto}
h1{font-size:34px;margin-bottom:4px}
.sub{color:#b7a9c9}
.card{background:#211e2b;padding:20px;border-radius:18px;margin:18px 0}
input{box-sizing:border-box;width:100%;padding:14px;border-radius:10px;border:0;margin:10px 0;background:#fff;color:#111;font-size:16px}
button{border:0;border-radius:10px;padding:13px 17px;margin:5px;background:#a77bdb;color:#15111b;font-weight:bold;font-size:15px}
button.secondary{background:#393344;color:white}
button:disabled{opacity:.45}
.track{padding:12px 0;border-bottom:1px solid #45404f}
small{color:#c0b6cc}
#status{color:#d5b7ff;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>RAFA MONTENEGRO</h1>
<div class="sub">Tu asistente musical personal</div>

<div class="card">
<h3>Conexión Spotify</h3>
<p id="status">Conectá tu cuenta para comenzar.</p>
<button id="connect">Conectar con Spotify</button>
<button id="logout" class="secondary">Desconectar</button>
</div>

<div class="card">
<h3>Buscar música</h3>
<input id="query" placeholder="Artista, canción o estilo musical">
<button id="search">Buscar canciones</button>
<div id="results"></div>
</div>

<div class="card">
<h3>Controles</h3>
<p id="now">Todavía no consultamos qué está sonando.</p>
<button id="refresh" class="secondary">Ver qué suena</button>
<button id="pause" class="secondary">Pausar</button>
<button id="next" class="secondary">Siguiente canción</button>
</div>
</main>

<script>
const CLIENT_ID = "92732ff5d851466bb5836748075c8e45";
const REDIRECT_URI = "https://joacolote.github.io/rafa-montenegro/";
const SCOPES = "user-read-playback-state user-read-currently-playing user-modify-playback-state";
let token = sessionStorage.getItem("rafa_token");

const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");

function status(msg){statusEl.textContent=msg;}

function randomString(length){
 const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
 const bytes=crypto.getRandomValues(new Uint8Array(length));
 return Array.from(bytes,b=>chars[b%chars.length]).join("");
}

async function challenge(verifier){
 const data=new TextEncoder().encode(verifier);
 const digest=await crypto.subtle.digest("SHA-256",data);
 return btoa(String.fromCharCode(...new Uint8Array(digest)))
 .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

async function connect(){
 const verifier=randomString(64);
 const state=randomString(32);
 sessionStorage.setItem("rafa_verifier",verifier);
 sessionStorage.setItem("rafa_state",state);
 const codeChallenge=await challenge(verifier);
 const url=new URL("https://accounts.spotify.com/authorize");
 url.search=new URLSearchParams({
  client_id:CLIENT_ID,
  response_type:"code",
  redirect_uri:REDIRECT_URI,
  code_challenge_method:"S256",
  code_challenge:codeChallenge,
  state:state,
  scope:SCOPES
 });
 location.href=url.toString();
}

async function handleCallback(){
 const params=new URLSearchParams(location.search);
 const code=params.get("code");
 if(params.get("error")){status("No se autorizó el acceso a Spotify.");return;}
 if(!code)return;
 if(params.get("state")!==sessionStorage.getItem("rafa_state")){
  status("Error de seguridad: estado inválido.");return;
 }
 try{
  const body=new URLSearchParams({
   client_id:CLIENT_ID,
   grant_type:"authorization_code",
   code:code,
   redirect_uri:REDIRECT_URI,
   code_verifier:sessionStorage.getItem("rafa_verifier")
  });
  const response=await fetch("https://accounts.spotify.com/api/token",{
   method:"POST",
   headers:{"Content-Type":"application/x-www-form-urlencoded"},
   body
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error_description||data.error||"No se pudo conectar");
  token=data.access_token;
  sessionStorage.setItem("rafa_token",token);
  history.replaceState({},document.title,REDIRECT_URI);
  status("¡Rafa está conectado a Spotify!");
 }catch(e){status("Error al conectar: "+e.message);}
}

async function api(path,options={}){
 if(!token)throw new Error("Primero conectá Spotify.");
 const response=await fetch("https://api.spotify.com/v1"+path,{
  ...options,
  headers:{
   Authorization:"Bearer "+token,
   "Content-Type":"application/json",
   ...(options.headers||{})
  }
 });
 if(response.status===204)return null;
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(data.error?.message||"Error de Spotify ("+response.status+")");
 return data;
}

async function search(){
 const q=document.getElementById("query").value.trim();
 if(!q)return;
 resultsEl.textContent="Buscando...";
 try{
  const data=await api("/search?"+new URLSearchParams({q,type:"track",limit:"10"}));
  resultsEl.innerHTML="";
  if(!data.tracks.items.length){resultsEl.textContent="No encontré canciones.";return;}
  data.tracks.items.forEach(track=>{
   const div=document.createElement("div");
   div.className="track";
   const name=document.createElement("strong");
   name.textContent=track.name;
   const artist=document.createElement("div");
   artist.innerHTML="<small></small>";
   artist.firstChild.textContent=track.artists.map(a=>a.name).join(", ");
   const btn=document.createElement("button");
   btn.textContent="Reproducir";
   btn.onclick=()=>play(track.uri);
   div.append(name,artist,btn);
   resultsEl.append(div);
  });
 }catch(e){resultsEl.textContent=e.message;}
}

async function play(uri){
 try{
  await api("/me/player/play",{method:"PUT",body:JSON.stringify({uris:[uri]})});
  status("Solicitud enviada a Spotify.");
  setTimeout(refresh,1200);
 }catch(e){status(e.message+" Abrí Spotify en tu Motorola y elegí el parlante como dispositivo.");}
}

async function refresh(){
 try{
  const data=await api("/me/player/currently-playing");
  document.getElementById("now").textContent=
   data?.item ? "Sonando: "+data.item.name+" — "+data.item.artists.map(a=>a.name).join(", ")
   : "Spotify no informa una canción en reproducción.";
 }catch(e){status(e.message);}
}

async function pause(){
 try{await api("/me/player/pause",{method:"PUT"});status("Reproducción pausada.");}
 catch(e){status(e.message);}
}

async function next(){
 try{await api("/me/player/next",{method:"POST"});status("Pasando a la siguiente canción.");setTimeout(refresh,1200);}
 catch(e){status(e.message);}
}

document.getElementById("connect").onclick=connect;
document.getElementById("search").onclick=search;
document.getElementById("refresh").onclick=refresh;
document.getElementById("pause").onclick=pause;
document.getElementById("next").onclick=next;
document.getElementById("logout").onclick=()=>{
 token=null;
 sessionStorage.removeItem("rafa_token");
 status("Sesión desconectada. Para revocar el acceso, hacelo también desde tu cuenta de Spotify.");
};
handleCallback();
if(token)status("Sesión de Spotify disponible en esta pestaña.");
</script>
</body>
</html>
